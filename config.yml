baseURL: "https://cshubhamrao.dev"
# Used as the <title> of the homepage and as the suffix on every other page.
# "Shubham Rao" alone ranked ~6 among namesakes with 1.66% CTR: searchers had no way
# to tell which Shubham Rao this is. The person's name for structured data is set
# separately at params.schema.person.name.
title: Shubham Rao — Backend & Platform Engineer
theme: PaperMod

pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

languages:
  en:
    label: "English"  # renamed from languageName, deprecated in Hugo v0.158
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series

params:
  env: production  # Enables OpenGraph, Twitter Cards, Schema.org
  title: Shubham Rao
  description: "Backend and platform engineer. I build the systems other systems depend on: control planes, APIs, workflow engines, and the correctness mechanisms that keep them dependable."
  author: Shubham Rao
  images: ["/og-image.png"]
  DateFormat: "January 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # Full post text in the feed. Readers who subscribe should not have to click
  # through, and it costs nothing on a site this size.
  ShowFullTextinRSS: true

  # Colours already declared in static/browserconfig.xml and site.webmanifest;
  # repeated here so the theme emits matching meta tags instead of its defaults.
  # (assets.favicon* are set above.)

  # Client-side search over the JSON index declared in `outputs.home`.
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
    theme_color: "#ffffff"
    msapplication_TileColor: "#2b5797"

  label:
    text: "Shubham Rao"
    icon: /apple-touch-icon.png
    iconHeight: 35

  # Renders inside <footer>. The theme's default copyright line prints site.Title,
  # which now carries the SEO descriptor and reads badly in a footer, so it is off and
  # the credit is written here instead. The llms.txt anchor is a real link so agents
  # that only follow URLs they have seen can reach it — see
  # layouts/partials/extend_head.html for the machine-readable pair.
  footer:
    hideCopyright: true
    text: "© [Shubham Rao](/) · [llms.txt](/llms.txt)"

  schema:
    publisherType: Person
    sameAs:
      - "https://github.com/cshubhamrao/"
      - "https://www.linkedin.com/in/cshubhamrao/"
      - "https://twitter.com/cshubhamrao/"
      - "mailto:contact@cshubhamrao.dev"
    person:
      # The person's actual name, kept apart from site.Title so the SEO title can
      # carry a descriptor without corrupting schema.org Person.name.
      name: "Shubham Rao"
      alternateName: "cshubhamrao"
      description: "Senior Software Engineer building the systems other systems depend on: control planes, APIs, workflow engines, and entity reconciliation. I put correctness into the schema, so a mistake is hard to ship in the first place."
      jobTitle: "Senior Software Engineer, Core (Platform)"
      worksFor:
        name: "Lyric.tech"
        url: "https://www.lyric.tech/"
      alumniOf:
        - name: "UC Berkeley College of Engineering"
          url: "https://engineering.berkeley.edu/"
        - name: "SRM University, AP"
          url: "https://www.srmap.edu.in/"
      knowsAbout:
        - Distributed Systems
        - Platform Engineering
        - Backend Engineering
        - Observability
        - API Design
        - Microservices Architecture
        - Go Programming
        - Python Programming
        - LLM Infrastructure
        - System Design
        - Database Systems
        - MLOps
        - Kubernetes
        - TypeScript
        - gRPC
        - API Gateway Architecture
        - OpenTelemetry
        - Docker
        - Cloud Computing
      knowsLanguage:
        - English
        - Hindi
        - Telugu
      hasCredential:
        - credentialCategory: "Professional Certification"
          name: "Google Cloud Associate Cloud Engineer"
          recognizedBy: "Google Cloud"
      award:
        - "Winner, IIIT-Delhi HACKIIITD 2017 (1st place out of 800+ teams)"
        - "President's Placement Award - SRM University"
        - "Grand Finalist - TCS IT Wiz 2013"
        - "Google Cloud Associate Cloud Engineer Certification"
      hasOccupation:
        name: "Senior Software Engineer"
        occupationalCategory: "15-1252.00"
        description: "Building core backend services and platform infrastructure. Specializing in control planes, workflow orchestration, entity reconciliation, and schema-carried correctness."
        skills:
          - Go
          - Python
          - TypeScript
          - Kubernetes
          - Docker
          - AWS
          - GCP
          - Apache APISIX
          - Kafka
          - RabbitMQ
          - PostgreSQL
          - Redis
          - OpenTelemetry
          - gRPC
          - System Design
          - Platform Engineering
      workLocation: "Remote"
      nationality: "India"
      contactPoint:
        email: "contact@cshubhamrao.dev"
        contactType: "Professional"
        availableLanguage:
          - English
          - Hindi
          - Telugu
      performerIn:
        - name: "DevOpsDays Bengaluru 2023"
          description: "Talk on APISIX as reverse proxy for high-volume inference traffic"
          startDate: "2023"
      memberOf:
        - name: "Next Tech Lab AP"
          description: "Board Member - Scaled organization from <20 to 150+ members"
        - name: "ACM Student Chapter"
          description: "Founding Member - Grew chapter to 200+ members"
      email: "contact@cshubhamrao.dev"
      url: "https://cshubhamrao.dev"
      image: "/logo.jpg"

  # Profile Mode for portfolio homepage
  profileMode:
    enabled: true
    title: "Shubham Rao"
    subtitle: |
      I build the systems your systems depend on.

      It's my job and my passion, and the passion came first. Control planes, workflow DSLs, entity reconciliation, and schemas that refuse to let you ship a mistake.
    imageUrl: "/logo.jpg"
    imageWidth: 150
    imageHeight: 150
    imageTitle: "Shubham Rao"
    buttons:
      - name: About Me
        url: about

  # Cards under the homepage hero. Rendered by layouts/partials/index_profile.html.
  # Keep it to three: this is proof that the positioning is real, not a portfolio.
  # Lead with the mechanism; a number is support, never the headline.
  selectedWork:
    - title: "Supply-chain workflow platform"
      meta: "Lyric · 2025–present"
      description: "Entity reconciliation, workflow DSLs, and the data APIs behind supply-chain workflows. Messy inputs in, stable contracts out."
      url: "/about/#-lyrictech"
    - title: "Model-serving control plane"
      meta: "Tune AI · Go, gRPC"
      description: "A schema-first gRPC backbone, so clients and servers could evolve without a flag day. It carried 100M tokens a day."
      url: "/about/#-tune-ai-formerly-nimbleboxai"
    - title: "Credit accounting ledger"
      meta: "Personal · TigerBeetle, Temporal"
      description: "Idempotent by construction: replay a request and the ledger refuses to charge you twice."
      url: "https://github.com/cshubhamrao/cloud-credit-system"
      linkText: "Source"

  socialIcons:
    - name: github
      url: "https://github.com/cshubhamrao/"
    - name: linkedin
      url: "https://www.linkedin.com/in/cshubhamrao/"
    - name: x
      url: "https://twitter.com/cshubhamrao/"
    - name: email
      url: "mailto:contact@cshubhamrao.dev"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    # Label only. The URL stays /books/ so an indexed page does not become a redirect
    # for a cosmetic rename.
    - identifier: books
      name: Reading
      url: /books/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - Sitemap
    - JSON   # builds the Fuse.js index consumed by /search/
  section:
    - HTML
    - RSS
  page:
    - HTML
  taxonomy:
    - HTML
    - RSS
  term:
    - HTML
    - RSS

markup:
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
